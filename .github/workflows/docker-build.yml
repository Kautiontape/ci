# PR check for anything with a Dockerfile: build the image, never push.
# Exercises dependency install + app build exactly as production does.
name: docker-build

on:
  workflow_call:
    inputs:
      context:
        type: string
        default: .
      file:
        description: Dockerfile path; empty means <context>/Dockerfile
        type: string
        default: ""
      submodules:
        description: actions/checkout submodules value (false, true or recursive)
        type: string
        default: "false"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: false
          cache-from: type=gha,scope=${{ inputs.context }}
          cache-to: type=gha,mode=max,scope=${{ inputs.context }}
