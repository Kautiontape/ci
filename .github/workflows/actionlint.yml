# PR check for repos whose main content is workflows (fork-sync, this repo).
name: actionlint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The fleet's self-hosted runner labels, unless the repo brings its own config.
      - name: Default config
        run: |
          if [ ! -f .github/actionlint.yaml ] && [ ! -f .github/actionlint.yml ]; then
            printf 'self-hosted-runner:\n  labels: [ktn, bcx]\n' > .github/actionlint.yaml
          fi
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
